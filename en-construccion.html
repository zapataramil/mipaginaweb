<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Próximamente · Ramil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bg" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
</div>
<div class="grid-overlay" aria-hidden="true"></div>

<main class="construccion-wrap">

  <div class="construccion">

    <svg class="construccion-bg-turtle" viewBox="0 0 60 40" aria-hidden="true">
      <ellipse cx="30" cy="22" rx="20" ry="13" fill="#52b788"/>
      <ellipse cx="52" cy="24" rx="8" ry="6" fill="#95d5b2"/>
      <circle cx="56" cy="22" r="1.6" fill="#0b2419"/>
      <ellipse cx="14" cy="12" rx="7" ry="4" transform="rotate(-25 14 12)" fill="#95d5b2"/>
      <ellipse cx="14" cy="32" rx="7" ry="4" transform="rotate(25 14 32)" fill="#95d5b2"/>
      <ellipse cx="42" cy="10" rx="6" ry="3.5" transform="rotate(-25 42 10)" fill="#95d5b2"/>
      <ellipse cx="42" cy="34" rx="6" ry="3.5" transform="rotate(25 42 34)" fill="#95d5b2"/>
      <polygon points="30,13 38,22 30,31 22,22" fill="none" stroke="#d8f3dc" stroke-width="1.4"/>
    </svg>

    <div class="construccion-emoji" aria-hidden="true">🐢🌿</div>

    <h1>La página de <span class="empresa-nombre" id="nombre">esta empresa</span> está en construcción</h1>

    <p>Estamos trabajando en su presencia digital. ¡Volvé pronto!</p>

    <div class="barras" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>

    <div class="hero-actions" style="justify-content:center; margin-bottom:0;">
      <a class="btn btn-primary" href="index.html">← Volver al portafolio</a>
    </div>

  </div>

</main>

<script>
  const params = new URLSearchParams(location.search);
  const empresa = params.get("empresa");
  if (empresa) {
    document.getElementById("nombre").textContent = empresa;
    document.title = "Próximamente · " + empresa;
  }
</script>

</body>
</html>
